<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-labelledby="t">
  <title id="t">Codolio: 700 problems solved, 26 contests, longest streak 177 days</title>
  <style>
    :root { --card: #FFFFFF; --ink: #1F2937; --mute: #6B7280; --acc: #7C3AED; --line: #DDD6FE; }
    @media (prefers-color-scheme: dark) { :root { --card: #0D1117; --ink: #F9FAFB; --mute: #9CA3AF; --acc: #A78BFA; --line: #30363D; } }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .in { animation: in .8s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .in { animation: none; } }
  </style>
  <rect x="1" y="1" width="1198" height="148" rx="18" fill="var(--card)" stroke="var(--line)" stroke-width="2" />
  <text x="40" y="52" class="sans" font-size="20" font-weight="700" fill="var(--ink)">Competitive programming</text>
  <rect x="40" y="64" width="40" height="4" rx="2" fill="var(--acc)" />
  <text x="40" y="100" class="mono" font-size="12.5" fill="var(--mute)">tracked on Codolio</text>
  <text x="40" y="120" class="mono" font-size="12.5" fill="var(--mute)">as of October 2026</text>

  <g class="in" style="animation-delay:.1s">
    <text x="440" y="86" class="sans" font-size="46" font-weight="800" fill="var(--acc)" text-anchor="middle">700</text>
    <text x="440" y="116" class="sans" font-size="14" fill="var(--mute)" text-anchor="middle">problems solved</text>
  </g>
  <g class="in" style="animation-delay:.25s">
    <text x="720" y="86" class="sans" font-size="46" font-weight="800" fill="var(--acc)" text-anchor="middle">26</text>
    <text x="720" y="116" class="sans" font-size="14" fill="var(--mute)" text-anchor="middle">contests played</text>
  </g>
  <g class="in" style="animation-delay:.4s">
    <text x="1000" y="86" class="sans" font-size="46" font-weight="800" fill="var(--acc)" text-anchor="middle">177</text>
    <text x="1000" y="116" class="sans" font-size="14" fill="var(--mute)" text-anchor="middle">day longest streak</text>
  </g>
  <path d="M580 34v82M860 34v82" stroke="var(--line)" stroke-width="2" stroke-linecap="round" />
</svg>
