    <rect x="245" y="1" width="222" height="6" rx="3" fill="url(#bar)" />
    <text x="356" y="86" class="sans" font-size="46" font-weight="800" fill="url(#num)" text-anchor="middle">500K+</text>
    <text x="356" y="118" class="sans" font-size="14" fill="#9CA3AF" text-anchor="middle">tickets automated</text>
    <text x="356" y="138" class="sans" font-size="14" fill="#9CA3AF" text-anchor="middle">every year</text>
  </g>
  <g class="card" style="animation-delay:.25s">
