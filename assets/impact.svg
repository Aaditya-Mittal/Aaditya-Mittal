  <g class="card" style="animation-delay:.45s">
    <rect x="977" y="1" width="222" height="168" rx="16" fill="url(#card)" stroke="#2A2F4A" stroke-width="2" />
    <rect x="977" y="1" width="222" height="6" rx="3" fill="url(#bar)" />
    <text x="1088" y="86" class="sans" font-size="46" font-weight="800" fill="url(#num)" text-anchor="middle">700</text>
    <text x="1088" y="118" class="sans" font-size="14" fill="#9CA3AF" text-anchor="middle">coding problems</text>
    <text x="1088" y="138" class="sans" font-size="14" fill="#9CA3AF" text-anchor="middle">solved</text>
