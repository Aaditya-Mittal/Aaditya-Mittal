    </linearGradient>
    <linearGradient id="num" x1="0" x2="1">
      <stop offset="0" stop-color="#C4B5FD" /><stop offset="1" stop-color="#67E8F9" />
    </linearGradient>
  </defs>

  <g class="card" style="animation-delay:.05s">
