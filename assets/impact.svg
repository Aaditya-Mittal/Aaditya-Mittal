    <rect x="489" y="1" width="222" height="6" rx="3" fill="url(#bar)" />
    <text x="600" y="86" class="sans" font-size="46" font-weight="800" fill="url(#num)" text-anchor="middle">20+</text>
    <text x="600" y="118" class="sans" font-size="14" fill="#9CA3AF" text-anchor="middle">developers use my</text>
    <text x="600" y="138" class="sans" font-size="14" fill="#9CA3AF" text-anchor="middle">dependency script daily</text>
  </g>
  <g class="card" style="animation-delay:.35s">
    <rect x="733" y="1" width="222" height="168" rx="16" fill="url(#card)" stroke="#2A2F4A" stroke-width="2" />
    <rect x="733" y="1" width="222" height="6" rx="3" fill="url(#bar)" />
    <text x="844" y="86" class="sans" font-size="46" font-weight="800" fill="url(#num)" text-anchor="middle">12</text>
    <text x="844" y="118" class="sans" font-size="14" fill="#9CA3AF" text-anchor="middle">integrations</text>
    <text x="844" y="138" class="sans" font-size="14" fill="#9CA3AF" text-anchor="middle">delivered</text>
