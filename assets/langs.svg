<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250" role="img" aria-label="Top languages by code size">
  <title>Top languages by code size</title>
  <style>
  :root {
    --card: #0F1220; --ink: #F3F4F6; --mute: #9CA3AF; --acc: #A78BFA; --line: #2A2F4A;
    --l0: #1A2038; --l1: #3B2A7A; --l2: #5B3FD1; --l3: #8B5CF6; --l4: #22D3EE;
  }
  .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  .in { animation: in .7s ease both; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .cell { animation: pop .5s ease both; }
  @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
  .l0 { fill: var(--l0); } .l1 { fill: var(--l1); } .l2 { fill: var(--l2); }
  .l3 { fill: var(--l3); } .l4 { fill: var(--l4); }
  @media (prefers-reduced-motion: reduce) { .in, .cell { animation: none; } }
</style>
  <defs><linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151A33" /><stop offset="1" stop-color="#0F1220" /></linearGradient></defs>
  <rect x="1" y="1" width="578" height="248" rx="16" fill="url(#cardbg)" stroke="var(--line)" stroke-width="2" />
  <text x="32" y="46" class="sans" font-size="18" font-weight="700" fill="var(--ink)">Top languages</text>
  <rect x="32" y="56" width="40" height="4" rx="2" fill="var(--acc)" />
  <defs><clipPath id="bar"><rect x="32" y="84" width="516" height="14" rx="7" /></clipPath></defs>
  <g clip-path="url(#bar)">
    <rect x="32.0" y="84" width="175.2" height="14" fill="#e34c26" />
    <rect x="206.7" y="84" width="166.2" height="14" fill="#f34b7d" />
    <rect x="372.4" y="84" width="106.0" height="14" fill="#DA5B0B" />
    <rect x="478.0" y="84" width="36.3" height="14" fill="#3572A5" />
    <rect x="513.7" y="84" width="18.5" height="14" fill="#663399" />
    <rect x="531.8" y="84" width="16.7" height="14" fill="#f1e05a" />
  </g>
  <g class="in" style="animation-delay:0.00s"><circle cx="38" cy="132" r="6" fill="#e34c26" /><text x="52" y="136" class="sans" font-size="14" font-weight="600" fill="var(--ink)">HTML</text><text x="272" y="136" class="mono" font-size="13" fill="var(--mute)" text-anchor="end">33.9%</text></g>
  <g class="in" style="animation-delay:0.08s"><circle cx="308" cy="132" r="6" fill="#f34b7d" /><text x="322" y="136" class="sans" font-size="14" font-weight="600" fill="var(--ink)">C++</text><text x="542" y="136" class="mono" font-size="13" fill="var(--mute)" text-anchor="end">32.1%</text></g>
  <g class="in" style="animation-delay:0.16s"><circle cx="38" cy="164" r="6" fill="#DA5B0B" /><text x="52" y="168" class="sans" font-size="14" font-weight="600" fill="var(--ink)">Jupyter Notebook</text><text x="272" y="168" class="mono" font-size="13" fill="var(--mute)" text-anchor="end">20.4%</text></g>
  <g class="in" style="animation-delay:0.24s"><circle cx="308" cy="164" r="6" fill="#3572A5" /><text x="322" y="168" class="sans" font-size="14" font-weight="600" fill="var(--ink)">Python</text><text x="542" y="168" class="mono" font-size="13" fill="var(--mute)" text-anchor="end">6.9%</text></g>
  <g class="in" style="animation-delay:0.32s"><circle cx="38" cy="196" r="6" fill="#663399" /><text x="52" y="200" class="sans" font-size="14" font-weight="600" fill="var(--ink)">CSS</text><text x="272" y="200" class="mono" font-size="13" fill="var(--mute)" text-anchor="end">3.5%</text></g>
  <g class="in" style="animation-delay:0.40s"><circle cx="308" cy="196" r="6" fill="#f1e05a" /><text x="322" y="200" class="sans" font-size="14" font-weight="600" fill="var(--ink)">JavaScript</text><text x="542" y="200" class="mono" font-size="13" fill="var(--mute)" text-anchor="end">3.1%</text></g>
</svg>
