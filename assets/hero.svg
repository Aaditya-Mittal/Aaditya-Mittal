<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Aaditya Mittal</title>
  <desc id="d">Backend integrations, APIs and AI. A terminal types out a short profile object and a retry loop.</desc>
  <style>
    :root {
      --bg1: #F5F3FF; --bg2: #EDE9FE; --ink: #1F2937; --mute: #6B7280;
      --acc: #7C3AED; --line: #DDD6FE; --chip: #FFFFFF; --dot: #C4B5FD;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg1: #0D1117; --bg2: #161B22; --ink: #F9FAFB; --mute: #9CA3AF;
        --acc: #A78BFA; --line: #30363D; --chip: #21262D; --dot: #30363D;
      }
    }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .k { fill: #C4B5FD; } .p { fill: #67E8F9; } .s { fill: #86EFAC; } .t { fill: #E5E7EB; } .c { fill: #9CA3AF; }
    .fade { animation: fade 1s ease both; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .4s; } .d4 { animation-delay: .55s; }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .cover { fill: #0B0F14; transform-box: fill-box; transform-origin: right center; animation: wipe 14s steps(26) infinite; }
    @keyframes wipe {
      0% { transform: scaleX(1); } 10% { transform: scaleX(0); }
      88% { transform: scaleX(0); } 96%, 100% { transform: scaleX(1); }
    }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 50% { transform: scale(1.5); opacity: .5; } }
    .glow { animation: drift 9s ease-in-out infinite alternate; }
    @keyframes drift { to { transform: translate(40px, 24px); } }
    @media (prefers-reduced-motion: reduce) {
      .fade, .cover, .cursor, .pulse, .glow { animation: none; }
      .cover { transform: scaleX(0); }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--bg1)" />
      <stop offset="1" stop-color="var(--bg2)" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.30" />
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.22" />
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="var(--dot)" opacity="0.55" />
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="358" rx="20" /></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)" />
    <rect width="1200" height="360" fill="url(#dots)" />
    <g class="glow"><circle cx="150" cy="80" r="260" fill="url(#glow)" /></g>
    <circle cx="1120" cy="340" r="260" fill="url(#glow2)" />
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="20" fill="none" stroke="var(--line)" stroke-width="2" />

  <!-- left column -->
  <g class="fade d1">
    <text x="60" y="108" class="mono" font-size="14" letter-spacing="3" font-weight="700" fill="var(--acc)">BACKEND INTEGRATIONS  |  APIs  |  AI</text>
  </g>
  <g class="fade d2">
    <text x="60" y="186" class="sans" font-size="60" font-weight="800" fill="var(--ink)">Aaditya Mittal</text>
  </g>
  <g class="fade d3">
    <text x="60" y="228" class="sans" font-size="20" fill="var(--mute)">I stop at “I understand why”, not at “it works”.</text>
  </g>
  <g class="fade d4">
    <rect x="60" y="256" width="124" height="34" rx="17" fill="var(--chip)" stroke="var(--line)" />
    <text x="122" y="278" class="sans" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">ServiceNow</text>
    <rect x="196" y="256" width="164" height="34" rx="17" fill="var(--chip)" stroke="var(--line)" />
    <text x="278" y="278" class="sans" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">Python + FastAPI</text>
    <rect x="372" y="256" width="66" height="34" rx="17" fill="var(--chip)" stroke="var(--line)" />
    <text x="405" y="278" class="sans" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">C++</text>
    <rect x="450" y="256" width="136" height="34" rx="17" fill="var(--chip)" stroke="#22C55E" />
    <circle cx="472" cy="273" r="5" fill="#22C55E" class="pulse" />
    <text x="530" y="278" class="sans" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">Open to work</text>
  </g>

  <!-- terminal -->
  <g class="fade d2">
    <rect x="660" y="56" width="496" height="274" rx="14" fill="#0B0F14" stroke="#30363D" />
    <path d="M660 70a14 14 0 0 1 14-14h468a14 14 0 0 1 14 14v22H660z" fill="#161B22" />
    <circle cx="684" cy="74" r="6" fill="#FF5F57" />
    <circle cx="704" cy="74" r="6" fill="#FEBC2E" />
    <circle cx="724" cy="74" r="6" fill="#28C840" />
    <text x="908" y="79" class="mono" font-size="13" fill="#9CA3AF" text-anchor="middle">aaditya.js</text>

    <g class="mono" font-size="17">
      <text x="688" y="128"><tspan class="k">const</tspan><tspan class="t"> aaditya = {</tspan></text>
      <text x="709" y="156"><tspan class="p">role</tspan><tspan class="t">: </tspan><tspan class="s">"Analyst, integrations &amp; APIs"</tspan><tspan class="t">,</tspan></text>
      <text x="709" y="184"><tspan class="p">stack</tspan><tspan class="t">: [</tspan><tspan class="s">"Python"</tspan><tspan class="t">, </tspan><tspan class="s">"C++"</tspan><tspan class="t">, </tspan><tspan class="s">"JS"</tspan><tspan class="t">],</tspan></text>
      <text x="709" y="212"><tspan class="p">platform</tspan><tspan class="t">: </tspan><tspan class="s">"ServiceNow"</tspan><tspan class="t">,</tspan></text>
      <text x="709" y="240"><tspan class="p">openTo</tspan><tspan class="t">: [</tspan><tspan class="s">"SWE"</tspan><tspan class="t">, </tspan><tspan class="s">"Backend"</tspan><tspan class="t">, </tspan><tspan class="s">"AI/ML"</tspan><tspan class="t">],</tspan></text>
      <text x="688" y="268"><tspan class="t">};</tspan></text>
      <text x="688" y="306"><tspan class="k">while</tspan><tspan class="t"> (!solved) { </tspan><tspan class="p">try_again</tspan><tspan class="t">(); }</tspan></text>
    </g>

    <rect class="cover" x="684" y="110" width="462" height="24" style="animation-delay:.6s" />
    <rect class="cover" x="684" y="138" width="462" height="24" style="animation-delay:1.3s" />
    <rect class="cover" x="684" y="166" width="462" height="24" style="animation-delay:2.0s" />
    <rect class="cover" x="684" y="194" width="462" height="24" style="animation-delay:2.7s" />
    <rect class="cover" x="684" y="222" width="462" height="24" style="animation-delay:3.4s" />
    <rect class="cover" x="684" y="250" width="462" height="24" style="animation-delay:4.1s" />
    <rect class="cover" x="684" y="288" width="462" height="24" style="animation-delay:4.8s" />
    <rect class="cursor" x="1030" y="291" width="9" height="18" fill="#67E8F9" />
  </g>
</svg>
