<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Aaditya Mittal</title>
  <desc id="d">Analyst at Deloitte USI. Backend integrations, APIs and AI. A terminal types out a short profile object and a retry loop.</desc>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .k { fill: #C4B5FD; } .p { fill: #67E8F9; } .s { fill: #86EFAC; } .t { fill: #E5E7EB; }
    .fade { animation: fade 1s ease both; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .4s; } .d4 { animation-delay: .55s; }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .cover { fill: #070A14; transform-box: fill-box; transform-origin: right center; animation: wipe 14s steps(26) infinite; }
    @keyframes wipe {
      0% { transform: scaleX(1); } 10% { transform: scaleX(0); }
      88% { transform: scaleX(0); } 96%, 100% { transform: scaleX(1); }
    }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 50% { transform: scale(1.5); opacity: .5; } }
    .glow { animation: drift 9s ease-in-out infinite alternate; }
    @keyframes drift { to { transform: translate(40px, 24px); } }
    @media (prefers-reduced-motion: reduce) {
      .fade, .cover, .cursor, .pulse, .glow { animation: none; }
      .cover { transform: scaleX(0); }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020" />
      <stop offset="1" stop-color="#171C38" />
    </linearGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.34" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#C4B5FD" />
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2A3050" />
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="358" rx="20" /></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)" />
    <rect width="1200" height="360" fill="url(#dots)" />
    <g class="glow"><circle cx="150" cy="80" r="260" fill="url(#glowV)" /></g>
    <circle cx="1120" cy="340" r="260" fill="url(#glowC)" />
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="20" fill="none" stroke="#2A2F4A" stroke-width="2" />

  <!-- left column -->
  <g class="fade d1">
    <text x="60" y="108" class="mono" font-size="14" letter-spacing="3" font-weight="700" fill="#A78BFA">ANALYST AT DELOITTE USI  |  BACKEND  |  AI</text>
  </g>
  <g class="fade d2">
    <text x="60" y="186" class="sans" font-size="60" font-weight="800" fill="url(#name)">Aaditya Mittal</text>
  </g>
  <g class="fade d3">
    <text x="60" y="228" class="sans" font-size="20" fill="#9CA3AF">I stop at “I understand why”, not at “it works”.</text>
  </g>
  <g class="fade d4">
    <rect x="60" y="256" width="124" height="34" rx="17" fill="#151A33" stroke="#2A2F4A" />
    <text x="122" y="278" class="sans" font-size="14" font-weight="600" fill="#E5E7EB" text-anchor="middle">Deloitte USI</text>
    <rect x="196" y="256" width="118" height="34" rx="17" fill="#151A33" stroke="#2A2F4A" />
    <text x="255" y="278" class="sans" font-size="14" font-weight="600" fill="#E5E7EB" text-anchor="middle">ServiceNow</text>
    <rect x="326" y="256" width="164" height="34" rx="17" fill="#151A33" stroke="#2A2F4A" />
    <text x="408" y="278" class="sans" font-size="14" font-weight="600" fill="#E5E7EB" text-anchor="middle">Python + FastAPI</text>
    <rect x="502" y="256" width="136" height="34" rx="17" fill="#151A33" stroke="#22C55E" />
    <circle cx="524" cy="273" r="5" fill="#22C55E" class="pulse" />
    <text x="582" y="278" class="sans" font-size="14" font-weight="600" fill="#E5E7EB" text-anchor="middle">Open to work</text>
  </g>

  <!-- terminal -->
  <g class="fade d2">
    <rect x="660" y="56" width="496" height="274" rx="14" fill="#070A14" stroke="#2A2F4A" />
    <path d="M660 70a14 14 0 0 1 14-14h468a14 14 0 0 1 14 14v22H660z" fill="#151A33" />
    <circle cx="684" cy="74" r="6" fill="#FF5F57" />
    <circle cx="704" cy="74" r="6" fill="#FEBC2E" />
    <circle cx="724" cy="74" r="6" fill="#28C840" />
    <text x="908" y="79" class="mono" font-size="13" fill="#9CA3AF" text-anchor="middle">aaditya.js</text>

    <g class="mono" font-size="17">
      <text x="688" y="128"><tspan class="k">const</tspan><tspan class="t"> aaditya = {</tspan></text>
      <text x="709" y="156"><tspan class="p">role</tspan><tspan class="t">: </tspan><tspan class="s">"Analyst, Deloitte USI"</tspan><tspan class="t">,</tspan></text>
      <text x="709" y="184"><tspan class="p">stack</tspan><tspan class="t">: [</tspan><tspan class="s">"Python"</tspan><tspan class="t">, </tspan><tspan class="s">"C++"</tspan><tspan class="t">, </tspan><tspan class="s">"JS"</tspan><tspan class="t">],</tspan></text>
      <text x="709" y="212"><tspan class="p">platform</tspan><tspan class="t">: </tspan><tspan class="s">"ServiceNow"</tspan><tspan class="t">,</tspan></text>
      <text x="709" y="240"><tspan class="p">openTo</tspan><tspan class="t">: [</tspan><tspan class="s">"SWE"</tspan><tspan class="t">, </tspan><tspan class="s">"Backend"</tspan><tspan class="t">, </tspan><tspan class="s">"AI/ML"</tspan><tspan class="t">],</tspan></text>
      <text x="688" y="268"><tspan class="t">};</tspan></text>
      <text x="688" y="306"><tspan class="k">while</tspan><tspan class="t"> (!solved) { </tspan><tspan class="p">try_again</tspan><tspan class="t">(); }</tspan></text>
    </g>

    <rect class="cover" x="684" y="110" width="462" height="24" style="animation-delay:.6s" />
    <rect class="cover" x="684" y="138" width="462" height="24" style="animation-delay:1.3s" />
    <rect class="cover" x="684" y="166" width="462" height="24" style="animation-delay:2.0s" />
    <rect class="cover" x="684" y="194" width="462" height="24" style="animation-delay:2.7s" />
    <rect class="cover" x="684" y="222" width="462" height="24" style="animation-delay:3.4s" />
    <rect class="cover" x="684" y="250" width="462" height="24" style="animation-delay:4.1s" />
    <rect class="cover" x="684" y="288" width="462" height="24" style="animation-delay:4.8s" />
    <rect class="cursor" x="1030" y="291" width="9" height="18" fill="#67E8F9" />
  </g>
</svg>
