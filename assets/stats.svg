<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250" role="img" aria-label="GitHub statistics">
  <title>GitHub statistics</title>
  <style>
  :root {
    --card: #0F1220; --ink: #F3F4F6; --mute: #9CA3AF; --acc: #A78BFA; --line: #2A2F4A;
    --l0: #1A2038; --l1: #3B2A7A; --l2: #5B3FD1; --l3: #8B5CF6; --l4: #22D3EE;
  }
  .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  .in { animation: in .7s ease both; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .cell { animation: pop .5s ease both; }
  @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
  .l0 { fill: var(--l0); } .l1 { fill: var(--l1); } .l2 { fill: var(--l2); }
  .l3 { fill: var(--l3); } .l4 { fill: var(--l4); }
  @media (prefers-reduced-motion: reduce) { .in, .cell { animation: none; } }
</style>
  <defs><linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151A33" /><stop offset="1" stop-color="#0F1220" /></linearGradient></defs>
  <rect x="1" y="1" width="578" height="248" rx="16" fill="url(#cardbg)" stroke="var(--line)" stroke-width="2" />
  <text x="32" y="46" class="sans" font-size="18" font-weight="700" fill="var(--ink)">GitHub, by the numbers</text>
  <rect x="32" y="56" width="40" height="4" rx="2" fill="var(--acc)" />
  <g class="in" style="animation-delay:0.00s"><text x="32" y="108" class="sans" font-size="30" font-weight="800" fill="var(--acc)">9</text><text x="32" y="130" class="sans" font-size="12.5" fill="var(--mute)">public repos</text></g>
  <g class="in" style="animation-delay:0.08s"><text x="216" y="108" class="sans" font-size="30" font-weight="800" fill="var(--acc)">0</text><text x="216" y="130" class="sans" font-size="12.5" fill="var(--mute)">stars earned</text></g>
  <g class="in" style="animation-delay:0.16s"><text x="400" y="108" class="sans" font-size="30" font-weight="800" fill="var(--acc)">5</text><text x="400" y="130" class="sans" font-size="12.5" fill="var(--mute)">followers</text></g>
  <g class="in" style="animation-delay:0.24s"><text x="32" y="174" class="sans" font-size="30" font-weight="800" fill="var(--acc)">223</text><text x="32" y="196" class="sans" font-size="12.5" fill="var(--mute)">commits, last year</text></g>
  <g class="in" style="animation-delay:0.32s"><text x="216" y="174" class="sans" font-size="30" font-weight="800" fill="var(--acc)">3</text><text x="216" y="196" class="sans" font-size="12.5" fill="var(--mute)">pull requests, last year</text></g>
  <g class="in" style="animation-delay:0.40s"><text x="400" y="174" class="sans" font-size="30" font-weight="800" fill="var(--acc)">7 / 100</text><text x="400" y="196" class="sans" font-size="12.5" fill="var(--mute)">streak: now / longest</text></g>
  <text x="548" y="236" class="mono" font-size="10.5" fill="var(--mute)" text-anchor="end">includes private activity, updated 2026-10-31 UTC</text>
</svg>
